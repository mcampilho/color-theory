<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colour Illusions</title>
<style>
  :root { --page: #e9e9ea; --card: #fafafa; --ink: #202024; --soft: #606068; --line: #c9c9ce; --link: #1c54ad; }
  @media (prefers-color-scheme: dark) {
    :root { --page: #232326; --card: #2e2e32; --ink: #ececee; --soft: #a8a8b0; --line: #4a4a50; --link: #8ab4f8; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--page); color: var(--ink);
         font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; }
  h1 { margin: 0; font-size: 26px; }
  h2 { margin: 14px 0 8px; font-size: 20px; }
  h3 { margin: 12px 0 2px; font-size: 15px; color: var(--link); }
  p { margin: 0; }
  a { color: var(--link); }
  .soft { color: var(--soft); }
  .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: end; margin-top: 10px; }
  label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--soft); }
  select, button, input { font: inherit; color: var(--ink); background: var(--card);
                          border: 1px solid var(--line); border-radius: 6px; }
  select, button { height: 34px; padding: 0 10px; }
  button { cursor: pointer; }
  button[aria-pressed="true"] { background: var(--link); border-color: var(--link); color: var(--card); }
  button:disabled { opacity: .45; cursor: default; }
  input[type="color"] { width: 62px; height: 34px; padding: 2px 4px; }
  input[type="range"] { width: 180px; height: 34px; border: 0; background: none; }
  [hidden] { display: none !important; }
  #stage { margin-top: 10px; background: var(--card); border: 1px solid var(--line); }
  #stage svg { display: block; width: 100%; height: auto; max-height: 72vh; }
  #stage .t-remove, #stage .t-aid, #stage .t-guide { transition: opacity .7s; }
  #stage .t-aid, #stage .t-guide { opacity: 0; }
  #stage.aided .t-aid, #stage.aided .t-guide { opacity: 1; }
  #stage.aided .t-remove { opacity: 0; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p id="subtitle" class="soft"></p>
  <div class="row">
    <label><span data-ui="language"></span><select id="lang"></select></label>
    <label><span data-ui="illusion"></span><select id="illusion"></select></label>
    <button id="previous">&#9664;</button>
    <button id="next">&#9654;</button>
    <label id="variant-box"><span data-ui="version"></span><select id="variant"></select></label>
  </div>
  <div class="row">
    <label><span data-ui="colours"></span><select id="palette"></select></label>
    <label class="pair"><span data-ui="dark"></span><input type="color" id="dark"></label>
    <label class="pair"><span data-ui="light"></span><input type="color" id="light"></label>
    <span id="pickers" class="row"></span>
    <label><span data-ui="hue"></span><input type="range" id="hue" min="0" max="359" value="0"></label>
    <button id="reset" data-ui="reset"></button>
  </div>
  <h2 id="name"></h2>
  <div class="row">
    <button id="help" aria-pressed="false"></button>
    <p id="help-text" class="soft"></p>
  </div>
  <div id="stage"></div>
  <p id="note" class="soft"></p>
  <div id="texts"></div>
</main>

ous","next":"Next","version":"Version","scintillating":"Scintillating","colours":"Colour pair","dark":"Instead of black","light":"Instead of white","colour":"Colour","hue":"Rotate hue","reset":"Original colours","help":"Show help","unhelp":"Hide help","fixed":"This illusion depends on its own colours: use the hue slider.","note":"Greys become mixtures of the two colours, so areas that were equal stay equal. Many illusions weaken when both colours are equally light.","original":"Original","red_green":"Red / green","blue_orange":"Blue / orange","violet_yellow":"Violet / yellow","blue_yellow":"Blue / yellow","equal_light":"Red / green, equal lightness","custom":"Custom","see":{"checker":"Square A looks much darker than square B. They are exactly the same grey: turn on the help to see it.","muller_lyer":"The line with outward fins looks longer than the one with inward fins. Both are equal.","poggendorff":"The black line entering the grey block on the left seems to come out as the blue line. It comes out as the upper black one: turn on the help to see it."},"aids":{"contrast":"The four surrounds are removed.","bezold":"The stripes are removed.","constancy":"Everything but the two compared tiles is removed.","lilac":"The animation stops.","checker":"A strip of one colour joins squares A and B.","white":"The stripes are removed.","mach":"Gaps separate the bands, and each one looks uniform.","cornsweet":"The edge between the two halves is covered.","ehrenstein":"The lines are completed, and the discs vanish.","irradiation":"Guide lines compare the sides of the squares.","ebbinghaus":"Two parallel lines touch both central circles.","muller_lyer":"The fins are removed and the lengths compared.","ponzo":"The railway is removed.","cafe":"Straight lines are drawn along the mortar.","fraser":"Perfect circles are drawn over the figure.","hering":"The background lines are removed.","wundt":"The background lines are removed.","orbison":"The background rings are removed.","zollner":"The short strokes are removed.","poggendorff":"The hidden part of the line is shown.","tilt":"The surrounding gratings are removed."}},"title":"Colour Illusions","subtitle":"What the eye sees is not what is on the page","headings":["What you see","Why it happens","Try this"],"categories":{"colour":"Colour","brightness":"Brightness and contrast","size":"Size and length","lines":"Bent and tilted lines","motion":"Motion in still pictures","form":"Figure, ground and impossible objects"},"texts":{"contrast":["Simultaneous contrast","The four small squares are the same grey. On the dark ground it looks lighter than on the light one; on blue it leans toward yellow, and on yellow toward blue.","Colour is judged by difference. A surround pushes the area inside it away from itself, in lightness and in hue.","Cut two holes in a sheet of paper so that only two of the small squares show: the difference disappears."],"bezold":["Bezold effect","The red behind the black stripes looks deeper and darker than the red behind the white stripes, which looks paler and pinker. It is one and the same red.","When small areas of colour alternate, the eye partly blends them (assimilation): the red takes on some of its neighbour. Wilhelm von Bezold noticed it while redesigning rugs by changing a single colour.","Step back from the page: the further away you are, the stronger the blend."],"constancy":["Colour constancy","Two copies of a mosaic are lit by a warm and by a cool light (the discs above). The second tile of the second row looks bluish on the left and yellowish on the right, yet it is the same neutral grey.","To keep objects recognisable, the brain estimates the colour of the light and discounts it. A grey seen in a scene that is all orange is read as a bluish surface.","Cover everything except the two grey tiles."],"afterimage":["Negative afterimage","After staring at the dot in the coloured rings, the plain dot on the right seems to be surrounded by rings of other colours: red, green and yellow.","The cells that respond to a colour tire (adapt). On a white surface the other cells answer more strongly and you see the complementary colour.","Stare at the left dot for 30 seconds without moving your eyes, then look at the right dot and blink."],"lilac":["Lilac chaser","Staring at the cross, a gap runs round the ring of lilac discs; then the gap turns into a green disc, and after a while the lilac discs may fade away altogether.","The moving gap is apparent motion (the phi phenomenon). Where a disc vanishes, an afterimage of the opposite colour, green, appears. The blurred discs that stay still in the periphery fade from awareness (Troxler's effect).","Fix your eyes on the cross for at least 30 seconds. Jeremy Hinton created this animation before 2005."],"mccollough":["McCollough effect","After looking in turn at red horizontal and green vertical stripes, the black and white patches below look tinted: greenish where the stripes are horizontal and pink where they are vertical.","The visual system adapts to a colour tied to an orientation. Celeste McCollough described it in 1965; it can last for hours and even months.","Alternate between the two coloured gratings, a few seconds each, for several minutes, then look at the small patches. Note that the effect can persist for a long time."],"chromostereopsis":["Chromostereopsis","Red and blue on black do not seem to lie in the same plane: for most people the red floats in front of the blue, for some it sinks behind.","The lens bends short and long wavelengths by different amounts (chromatic aberration), so the two colours land in slightly different places in each eye, and the brain reads the offset as depth.","View it in a dim room, with both eyes; try with and without glasses."],"checker":["Checker shadow illusion","Square A looks much darker than square B. They are exactly the same grey, as the bar in the second figure shows.","The brain reads a chequered floor with a shadow on it and corrects for the shadow: B must be a light square, so it is seen as light. Edward Adelson published the illusion in 1995.","Hide the rest of the board with two pieces of paper, leaving only A and B."],"white":["White's illusion and Munker","The grey bars set into the black stripes look lighter than those set into the white stripes. In the coloured version (Munker), the same red looks orange on one side and purplish on the other.","Surprisingly, each bar looks more like the stripe it replaces lies next to, against what simple contrast would predict: the eye seems to group each bar with the stripe it belongs to.","Compare the two groups through a small hole cut in paper."],"mach":["Mach bands","Each flat grey strip looks darker near its lighter neighbour and lighter near its darker one, as if the strips were fluted.","Neighbouring cells in the retina inhibit one another (lateral inhibition), which exaggerates edges. Ernst Mach described the effect in 1865.","Cover all strips but one: it is perfectly even."],"cornsweet":["Cornsweet illusion","The left half looks lighter than the right half. Away from the middle, both are the same grey.","Only the edge differs, rising on one side and falling on the other. The visual system takes the step at the edge as the difference between the whole areas.","Lay a pencil along the middle line and watch the two halves become equal."],"grid":["Grid illusions: Hermann and scintillating","In the white grid, grey smudges appear at the crossings, except where you look. With discs on a grey grid, black dots seem to flash on and off.","Hermann's grid (1870) was long explained by lateral inhibition alone; later experiments (bending the lines removes it) show that it also depends on how the cortex handles straight lines. The scintillating version was reported in the 1990s.","Let your eyes wander over the grid, then fix a single crossing."],"ehrenstein":["Ehrenstein illusion","Where the lines stop short of each other, bright discs seem to appear, whiter than the paper.","The line ends suggest a shape lying on top and hiding the crossings. The brain draws its outline (an illusory contour) and fills it with brightness.","Close the gaps in your mind, or with a pencil: the discs vanish."],"irradiation":["Irradiation illusion","The white square on black looks larger than the black square on white, although they are the same size.","Light scatters inside the eye and a bright area spreads on the retina. Galileo mentioned it in 1632; Helmholtz gave it its name.","Measure the two squares."],"ebbinghaus":["Ebbinghaus illusion (Titchener circles)","The orange circle surrounded by large circles looks smaller than the one surrounded by small circles.","Size is judged relative to the context; the distance and spacing of the surrounding circles also matter.","Cover the blue circles with your fingers."],"muller_lyer":["Müller-Lyer illusion","The line with outward fins looks longer than the one with inward fins. Both are equal, like the red line below.","The fins shift where the ends of the line seem to be; one account links them to the corners of rooms and buildings seen in depth. Franz Müller-Lyer described it in 1889.","Compare both shafts with the dashed guides."],"ponzo":["Ponzo illusion","The upper yellow bar looks longer than the lower one.","Converging lines suggest distance, like railway tracks: a bar of the same size on the page, but farther away, would have to be larger.","Measure the two bars, or turn the page upside down."],"cafe":["Café wall illusion","The grey mortar lines seem to slope alternately, although they are parallel and level.","The offset black and white tiles, with a mortar of intermediate grey, create small tilted elements along each line. Richard Gregory named it in 1973 after a café wall in Bristol.","Look along a mortar line with the page almost edge-on."],"fraser":["Fraser spiral illusion","A spiral seems to wind into the centre. There is no spiral: the black and white strands form concentric circles.","Each short strand is tilted, and the twisted background adds to the tilt, so the eye joins them into a spiral. James Fraser described it in 1908.","Put a finger on one strand and follow it: you come back to where you started."],"hering":["Hering illusion","The two red lines seem to bow apart near the middle. They are straight and parallel.","The angles with the radiating lines are overestimated, and the pattern also suggests motion into depth. Ewald Hering discovered it in 1861.","Hold a ruler along a red line."],"wundt":["Wundt illusion","The two red lines seem to bow inward, toward each other, in the middle. They are straight and parallel.","It is the counterpart of Hering's figure: the radiating lines now spread from points on either side, so the angles bias the red lines the other way. Wilhelm Wundt described it in 1898.","Compare it with the Hering illusion."],"orbison":["Orbison illusion","The red square looks distorted, its sides bent and its corners pulled.","As in Hering's figure, the crossings with the background rings bias the perceived direction of each side. William Orbison described it in 1939.","Check the sides with a ruler."],"zollner":["Zöllner illusion","The long diagonal lines seem to converge and diverge. They are parallel.","The short strokes cross them at an angle and the visual system exaggerates acute angles, turning each line a little. Johann Zöllner reported it in 1860.","Look along the long lines from one corner of the page."],"poggendorff":["Poggendorff illusion","The black line entering the grey block on the left seems to come out as the blue line. It comes out as the upper black one, as the second figure shows.","Acute angles between the line and the block are seen as wider than they are, shifting the apparent path. It was noticed in Zöllner's own drawings.","Extend the left line with a ruler."],"tilt":["Tilt illusion and tilt aftereffect","The stripes in the two inner discs are both vertical, but seem to lean away from the stripes around them.","Cells tuned to nearby orientations inhibit one another, repelling the perceived angle. Looking long at tilted stripes has a similar effect on what you see next.","Cover the outer rings and compare the inner discs."],"motion":["Illusory motion","The rings seem to turn slowly, especially those you are not looking at directly.","Blocks of different contrast are processed with slightly different delays, and each small eye movement restarts the sequence; motion detectors read it as movement.","Move your gaze from one wheel to another, or blink."],"drift":["Peripheral drift illusion","The rings made of grey ramps appear to rotate when seen out of the corner of the eye.","A repeating ramp from dark to light (a sawtooth) stimulates motion detectors in the periphery; the motion is seen from dark to light.","Look to the side of the figure and blink quickly."],"rubin":["Rubin vase","A pale vase, or two dark faces looking at each other: one or the other, hardly both at once.","The shared outline can belong to only one side at a time: what is taken as the figure gets the shape and the rest becomes background. Edgar Rubin studied it around 1915.","Try to switch at will, and count how often it flips by itself."],"penrose":["Penrose triangle","A solid triangle of three square beams, each joined to the next at a right angle.","Every corner is consistent on its own, but the three cannot be true together: no such object exists. Oscar Reutersvärd drew it in 1934; Lionel and Roger Penrose made it popular, and it inspired M. C. Escher's Waterfall.","Cover one corner at a time: the rest becomes possible."]},"links":{"contrast":["https://en.wikipedia.org/wiki/Contrast_effect",true],"bezold":["https://en.wikipedia.org/wiki/Bezold_effect",true],"constancy":["https://en.wikipedia.org/wiki/Color_constancy",true],"afterimage":["https://en.wikipedia.org/wiki/Afterimage",true],"lilac":["https://en.wikipedia.org/wiki/Lilac_chaser",true],"mccollough":["https://en.wikipedia.org/wiki/McCollough_effect",true],"chromostereopsis":["https://en.wikipedia.org/wiki/Chromostereopsis",true],"checker":["https://en.wikipedia.org/wiki/Checker_shadow_illusion",true],"white":["https://en.wikipedia.org/wiki/White%27s_illusion",true],"mach":["https://en.wikipedia.org/wiki/Mach_bands",true],"cornsweet":["https://en.wikipedia.org/wiki/Cornsweet_illusion",true],"grid":["https://en.wikipedia.org/wiki/Grid_illusion",true],"ehrenstein":["https://en.wikipedia.org/wiki/Ehrenstein_illusion",true],"irradiation":["https://en.wikipedia.org/wiki/Irradiation_illusion",true],"ebbinghaus":["https://en.wikipedia.org/wiki/Ebbinghaus_illusion",true],"muller_lyer":["https://en.wikipedia.org/wiki/M%C3%BCller-Lyer_illusion",true],"ponzo":["https://en.wikipedia.org/wiki/Ponzo_illusion",true],"cafe":["https://en.wikipedia.org/wiki/Caf%C3%A9_wall_illusion",true],"fraser":["https://en.wikipedia.org/wiki/Fraser_spiral_illusion",true],"hering":["https://en.wikipedia.org/wiki/Hering_illusion",true],"wundt":["https://en.wikipedia.org/wiki/Wundt_illusion",true],"orbison":["https://en.wikipedia.org/wiki/Orbison_illusion",true],"zollner":["https://en.wikipedia.org/wiki/Z%C3%B6llner_illusion",true],"poggendorff":["https://en.wikipedia.org/wiki/Poggendorff_illusion",true],"tilt":["https://en.wikipedia.org/wiki/Visual_tilt_effects",true],"motion":["https://en.wikipedia.org/wiki/Illusory_motion",true],"drift":["https://en.wikipedia.org/wiki/Peripheral_drift_illusion",true],"rubin":["https://en.wikipedia.org/wiki/Rubin_vase",true],"penrose":["https://en.wikipedia.org/wiki/Penrose_triangle",true]},"wiki":"Wikipedia article","inEnglish":"in English"},"pt":{"ui":{"language":"Língua","illusion":"Ilusão","previous":"Anterior","next":"Seguinte","version":"Versão","scintillating":"Cintilante","colours":"Par de cores","dark":"Em vez do preto","light":"Em vez do branco","colour":"Cor","hue":"Rodar o matiz","reset":"Cores originais","help":"Mostrar ajuda","unhelp":"Esconder ajuda","fixed":"Esta ilusão depende das suas próprias cores: use o controlo do matiz.","note":"Os cinzentos passam a misturas das duas cores, por isso áreas iguais continuam iguais. Muitas ilusões enfraquecem quando as duas cores são igualmente claras.","original":"Original","red_green":"Vermelho / verde","blue_orange":"Azul / laranja","violet_yellow":"Violeta / amarelo","blue_yellow":"Azul / amarelo","equal_light":"Vermelho / verde, igual luminosidade","custom":"Personalizado","see":{"checker":"O quadrado A parece muito mais escuro do que o B. São exatamente do mesmo cinzento: ligue a ajuda para o ver.","muller_lyer":"A linha com as aletas para fora parece mais comprida do que a das aletas para dentro. São iguais.","poggendorff":"A linha preta que entra no bloco cinzento pela esquerda parece sair como linha azul. Sai como a preta de cima: ligue a ajuda para o ver."},"aids":{"contrast":"Os quatro fundos são retirados.","bezold":"As riscas são retiradas.","constancy":"Retira-se tudo menos os dois mosaicos comparados.","lilac":"A animação para.","checker":"Uma faixa de uma só cor liga os quadrados A e B.","white":"As riscas são retiradas.","mach":"Intervalos separam as faixas, e cada uma parece uniforme.","cornsweet":"Tapa-se a fronteira entre as duas metades.","ehrenstein":"As linhas são completadas, e os discos desaparecem.","irradiation":"Linhas-guia comparam os lados dos quadrados.","ebbinghaus":"Duas linhas paralelas tocam nos dois círculos centrais.","muller_lyer":"Retiram-se as setas e comparam-se os comprimentos.","ponzo":"A linha de comboio é retirada.","cafe":"Traçam-se retas sobre a argamassa.","fraser":"Desenham-se círculos perfeitos sobre a figura.","hering":"As linhas de fundo são retiradas.","wundt":"As linhas de fundo são retiradas.","orbison":"Os anéis de fundo são retirados.","zollner":"Os traços curtos são retirados.","poggendorff":"Mostra-se a parte escondida da linha.","tilt":"As grelhas à volta são retiradas."}},"title":"Ilusões de Cor","subtitle":"O que o olho vê não é o que está na página","headings":["O que se vê","Porque acontece","Experimente"],"categories":{"colour":"Cor","brightness":"Luminosidade e contraste","size":"Tamanho e comprimento","lines":"Linhas curvadas e inclinadas","motion":"Movimento em imagens paradas","form":"Figura, fundo e objetos impossíveis"},"texts":{"contrast":["Contraste simultâneo","Os quatro quadrados pequenos são do mesmo cinzento. No fundo escuro parece mais claro do que no claro; sobre azul puxa para o amarelo e sobre amarelo puxa para o azul.","A cor é avaliada por diferença. O fundo afasta de si a zona que envolve, na luminosidade e no matiz.","Faça dois furos numa folha de modo a ver só dois dos quadrados pequenos: a diferença desaparece."],"bezold":["Efeito Bezold","O vermelho entre riscas pretas parece mais profundo e escuro do que o vermelho entre riscas brancas, que parece mais pálido e rosado. É um único vermelho.","Quando pequenas áreas de cor se alternam, o olho mistura-as em parte (assimilação): o vermelho fica com um pouco do vizinho. Wilhelm von Bezold reparou nisto ao redesenhar tapetes mudando uma só cor.","Afaste-se da página: quanto mais longe, mais forte a mistura."],"constancy":["Constância da cor","Duas cópias de um mosaico são iluminadas por uma luz quente e por uma luz fria (os discos de cima). A segunda peça da segunda linha parece azulada à esquerda e amarelada à direita, mas é o mesmo cinzento neutro.","Para reconhecer os objetos, o cérebro estima a cor da luz e desconta-a. Um cinzento numa cena toda alaranjada é lido como uma superfície azulada.","Tape tudo menos as duas peças cinzentas."],"afterimage":["Pós-imagem negativa","Depois de fixar o ponto nos anéis coloridos, o ponto simples à direita parece rodeado de anéis de outras cores: vermelho, verde e amarelo.","As células que respondem a uma cor cansam-se (adaptam-se). Sobre branco, as outras respondem com mais força e vê-se a cor complementar.","Fixe o ponto da esquerda durante 30 segundos sem mover os olhos, depois olhe para o ponto da direita e pestaneje."],"lilac":["Perseguidor lilás","Com os olhos na cruz, uma falha corre à volta do anel de discos lilás; depois a falha transforma-se num disco verde e, passado algum tempo, os discos lilás podem desaparecer.","A falha que anda é movimento aparente (fenómeno phi). Onde um disco desaparece surge uma pós-imagem da cor oposta, verde. Os discos desfocados e parados na periferia somem-se da perceção (efeito de Troxler).","Fixe a cruz pelo menos 30 segundos. Jeremy Hinton criou esta animação antes de 2005."],"mccollough":["Efeito McCollough","Depois de olhar à vez para riscas horizontais vermelhas e verticais verdes, as manchas a preto e branco em baixo parecem tingidas: esverdeadas onde as riscas são horizontais e rosadas onde são verticais.","O sistema visual adapta-se a uma cor ligada a uma orientação. Celeste McCollough descreveu-o em 1965; pode durar horas e até meses.","Alterne entre as duas grelhas coloridas, alguns segundos em cada, durante vários minutos, e depois olhe para as manchas pequenas. Atenção: o efeito pode persistir muito tempo."],"chromostereopsis":["Cromostereopsia","Vermelho e azul sobre preto não parecem estar no mesmo plano: para a maioria o vermelho flutua à frente do azul, para algumas pessoas fica atrás.","O cristalino desvia de forma diferente os comprimentos de onda curtos e longos (aberração cromática), as duas cores caem em sítios ligeiramente diferentes em cada olho e o cérebro lê o desvio como profundidade.","Veja numa sala pouco iluminada, com os dois olhos; experimente com e sem óculos."],"checker":["Ilusão da sombra no xadrez","O quadrado A parece muito mais escuro do que o B. São exatamente do mesmo cinzento, como mostra a barra da segunda figura.","O cérebro vê um chão aos quadrados com uma sombra e corrige a sombra: o B tem de ser um quadrado claro, por isso é visto como claro. Edward Adelson publicou a ilusão em 1995.","Tape o resto do tabuleiro com dois papéis, deixando só o A e o B."],"white":["Ilusão de White e de Munker","As barras cinzentas metidas nas riscas pretas parecem mais claras do que as metidas nas riscas brancas. Na versão a cores (Munker), o mesmo vermelho parece alaranjado de um lado e arroxeado do outro.","Surpreendentemente, o resultado contraria o que o contraste simples preveria: o olho parece agrupar cada barra com a risca a que pertence.","Compare os dois grupos através de um pequeno furo num papel."],"mach":["Bandas de Mach","Cada faixa cinzenta lisa parece mais escura junto à vizinha mais clara e mais clara junto à mais escura, como se as faixas fossem caneladas.","Células vizinhas da retina inibem-se umas às outras (inibição lateral), o que exagera as arestas. Ernst Mach descreveu o efeito em 1865.","Tape todas as faixas menos uma: é perfeitamente uniforme."],"cornsweet":["Ilusão de Cornsweet","A metade esquerda parece mais clara do que a direita. Longe do meio, são do mesmo cinzento.","Só a fronteira difere, a subir de um lado e a descer do outro. O sistema visual toma o degrau da fronteira como a diferença entre as áreas inteiras.","Ponha um lápis sobre a linha do meio e veja as duas metades igualarem-se."],"grid":["Ilusões de grelha: Hermann e cintilante","Na grelha branca aparecem manchas cinzentas nos cruzamentos, exceto onde se olha. Com discos numa grelha cinzenta, pontos pretos parecem acender e apagar.","A grelha de Hermann (1870) foi durante muito tempo explicada só pela inibição lateral; experiências posteriores (curvar as linhas elimina-a) mostram que depende também do modo como o córtex trata linhas retas. A versão cintilante foi descrita nos anos 1990.","Passeie o olhar pela grelha e depois fixe um só cruzamento."],"ehrenstein":["Ilusão de Ehrenstein","Onde as linhas param antes de se cruzarem parecem surgir discos luminosos, mais brancos do que o papel.","As pontas das linhas sugerem uma forma por cima a tapar os cruzamentos. O cérebro desenha o seu contorno (contorno ilusório) e enche-o de brilho.","Feche as falhas com a imaginação, ou com um lápis: os discos desaparecem."],"irradiation":["Ilusão de irradiação","O quadrado branco sobre preto parece maior do que o quadrado preto sobre branco, mas têm o mesmo tamanho.","A luz espalha-se dentro do olho e uma zona clara alarga-se na retina. Galileu refere-a em 1632; Helmholtz deu-lhe o nome.","Meça os dois quadrados."],"ebbinghaus":["Ilusão de Ebbinghaus (círculos de Titchener)","O círculo laranja rodeado de círculos grandes parece menor do que o rodeado de círculos pequenos.","O tamanho é avaliado em relação ao contexto; a distância e o espaçamento dos círculos à volta também contam.","Tape os círculos azuis com os dedos."],"muller_lyer":["Ilusão de Müller-Lyer","A linha com as aletas para fora parece mais comprida do que a das aletas para dentro. São iguais, como a linha vermelha em baixo.","As aletas deslocam o sítio onde parecem estar as pontas da linha; uma explicação liga-as aos cantos de salas e edifícios vistos em profundidade. Franz Müller-Lyer descreveu-a em 1889.","Compare os dois segmentos com as guias tracejadas."],"ponzo":["Ilusão de Ponzo","A barra amarela de cima parece mais comprida do que a de baixo.","As linhas convergentes sugerem distância, como carris: uma barra com o mesmo tamanho na página, mas mais afastada, teria de ser maior.","Meça as duas barras ou vire a página ao contrário."],"cafe":["Ilusão da parede do café","As linhas cinzentas de argamassa parecem inclinar-se alternadamente, mas são paralelas e horizontais.","Os ladrilhos pretos e brancos desencontrados, com argamassa de um cinzento intermédio, criam pequenos elementos inclinados ao longo de cada linha. Richard Gregory deu-lhe o nome em 1973, a partir da parede de um café em Bristol.","Olhe ao longo de uma linha de argamassa com a página quase de perfil."],"fraser":["Espiral de Fraser","Parece haver uma espiral a enrolar-se para o centro. Não há espiral: os cordões pretos e brancos formam círculos concêntricos.","Cada pequeno troço está inclinado e o fundo torcido reforça a inclinação, pelo que o olho os une numa espiral. James Fraser descreveu-a em 1908.","Ponha um dedo num cordão e siga-o: volta ao ponto de partida."],"hering":["Ilusão de Hering","As duas linhas vermelhas parecem curvar-se para fora ao meio. São retas e paralelas.","Os ângulos com as linhas radiais são sobrestimados e o padrão sugere também movimento em profundidade. Ewald Hering descobriu-a em 1861.","Encoste uma régua a uma linha vermelha."],"wundt":["Ilusão de Wundt","As duas linhas vermelhas parecem curvar-se para dentro, uma para a outra, ao meio. São retas e paralelas.","É o reverso da figura de Hering: as linhas radiais partem agora de pontos de um lado e do outro, e os ângulos enviesam as linhas vermelhas no sentido contrário. Wilhelm Wundt descreveu-a em 1898.","Compare-a com a ilusão de Hering."],"orbison":["Ilusão de Orbison","O quadrado vermelho parece deformado, com os lados vergados e os cantos puxados.","Como na figura de Hering, os cruzamentos com os anéis do fundo enviesam a direção percebida de cada lado. William Orbison descreveu-a em 1939.","Verifique os lados com uma régua."],"zollner":["Ilusão de Zöllner","As linhas diagonais compridas parecem convergir e divergir. São paralelas.","Os traços curtos cruzam-nas em ângulo e o sistema visual exagera os ângulos agudos, rodando um pouco cada linha. Johann Zöllner comunicou-a em 1860.","Olhe ao longo das linhas compridas a partir de um canto da página."],"poggendorff":["Ilusão de Poggendorff","A linha preta que entra no bloco cinzento pela esquerda parece sair como linha azul. Sai como a preta de cima, como mostra a segunda figura.","Os ângulos agudos entre a linha e o bloco parecem mais abertos do que são, deslocando o trajeto aparente. Foi notada nos próprios desenhos de Zöllner.","Prolongue a linha da esquerda com uma régua."],"tilt":["Ilusão e pós-efeito de inclinação","As riscas dos dois discos interiores são verticais, mas parecem inclinar-se para o lado oposto ao das riscas em redor.","Células afinadas para orientações próximas inibem-se, afastando o ângulo percebido. Olhar muito tempo para riscas inclinadas tem um efeito semelhante no que se vê a seguir.","Tape os anéis exteriores e compare os discos interiores."],"motion":["Movimento ilusório","As rodas parecem girar devagar, sobretudo aquelas para onde não se está a olhar.","Blocos com contrastes diferentes são processados com atrasos ligeiramente diferentes e cada pequeno movimento dos olhos reinicia a sequência; os detetores de movimento leem-na como deslocação.","Salte o olhar de uma roda para outra, ou pestaneje."],"drift":["Deriva periférica","Os anéis feitos de rampas de cinzento parecem rodar quando vistos pelo canto do olho.","Uma rampa repetida do escuro para o claro (dente de serra) estimula os detetores de movimento na periferia; o movimento é visto do escuro para o claro.","Olhe para o lado da figura e pestaneje depressa."],"rubin":["Vaso de Rubin","Um vaso claro, ou duas caras escuras a olhar uma para a outra: um ou outro, dificilmente os dois ao mesmo tempo.","O contorno comum só pode pertencer a um dos lados de cada vez: o que é tomado como figura fica com a forma e o resto passa a fundo. Edgar Rubin estudou-o por volta de 1915.","Tente alternar à vontade e conte quantas vezes muda sozinho."],"penrose":["Triângulo de Penrose","Um triângulo maciço de três vigas quadradas, cada uma unida à seguinte em ângulo reto.","Cada canto é coerente por si, mas os três não podem ser verdadeiros em conjunto: o objeto não existe. Oscar Reutersvärd desenhou-o em 1934; Lionel e Roger Penrose popularizaram-no, e inspirou a Queda de Água de M. C. Escher.","Tape um canto de cada vez: o resto passa a ser possível."]},"links":{"contrast":["https://en.wikipedia.org/wiki/Contrast_effect",false],"bezold":["https://en.wikipedia.org/wiki/Bezold_effect",false],"constancy":["https://en.wikipedia.org/wiki/Color_constancy",false],"afterimage":["https://en.wikipedia.org/wiki/Afterimage",false],"lilac":["https://en.wikipedia.org/wiki/Lilac_chaser",false],"mccollough":["https://en.wikipedia.org/wiki/McCollough_effect",false],"chromostereopsis":["https://en.wikipedia.org/wiki/Chromostereopsis",false],"checker":["https://en.wikipedia.org/wiki/Checker_shadow_illusion",false],"white":["https://en.wikipedia.org/wiki/White%27s_illusion",false],"mach":["https://pt.wikipedia.org/wiki/Bandas_de_Mach",true],"cornsweet":["https://en.wikipedia.org/wiki/Cornsweet_illusion",false],"grid":["https://pt.wikipedia.org/wiki/Ilus%C3%A3o_da_grelha",true],"ehrenstein":["https://en.wikipedia.org/wiki/Ehrenstein_illusion",false],"irradiation":["https://en.wikipedia.org/wiki/Irradiation_illusion",false],"ebbinghaus":["https://pt.wikipedia.org/wiki/Ilus%C3%A3o_de_Ebbinghaus",true],"muller_lyer":["https://pt.wikipedia.org/wiki/Ilus%C3%A3o_de_M%C3%BCller-Lyer",true],"ponzo":["https://en.wikipedia.org/wiki/Ponzo_illusion",false],"cafe":["https://pt.wikipedia.org/wiki/Ilus%C3%A3o_de_M%C3%BCnsterberg",true],"fraser":["https://en.wikipedia.org/wiki/Fraser_spiral_illusion",false],"hering":["https://en.wikipedia.org/wiki/Hering_illusion",false],"wundt":["https://en.wikipedia.org/wiki/Wundt_illusion",false],"orbison":["https://en.wikipedia.org/wiki/Orbison_illusion",false],"zollner":["https://pt.wikipedia.org/wiki/Ilus%C3%A3o_de_Z%C3%B6llner",true],"poggendorff":["https://pt.wikipedia.org/wiki/Ilus%C3%A3o_de_Poggendorff",true],"tilt":["https://en.wikipedia.org/wiki/Visual_tilt_effects",false],"motion":["https://en.wikipedia.org/wiki/Illusory_motion",false],"drift":["https://en.wikipedia.org/wiki/Peripheral_drift_illusion",false],"rubin":["https://pt.wikipedia.org/wiki/Vaso_de_Rubin",true],"penrose":["https://pt.wikipedia.org/wiki/Tri%C3%A2ngulo_de_Penrose",true]},"wiki":"Artigo na Wikipédia","inEnglish":"em inglês"},"es":{"ui":{"language":"Idioma","illusion":"Ilusión","previous":"Anterior","next":"Siguiente","version":"Versión","scintillating":"Centelleante","colours":"Par de colores","dark":"En lugar del negro","light":"En lugar del blanco","colour":"Color","hue":"Girar el tono","reset":"Colores originales","help":"Mostrar ayuda","unhelp":"Ocultar ayuda","fixed":"Esta ilusión depende de sus propios colores: use el control del tono.","note":"Los grises pasan a ser mezclas de los dos colores, así que las zonas iguales siguen iguales. Muchas ilusiones se debilitan cuando los dos colores son igual de claros.","original":"Original","red_green":"Rojo / verde","blue_orange":"Azul / naranja","violet_yellow":"Violeta / amarillo","blue_yellow":"Azul / amarillo","equal_light":"Rojo / verde, igual luminosidad","custom":"Personalizado","see":{"checker":"El cuadrado A parece mucho más oscuro que el B. Son exactamente del mismo gris: active la ayuda para verlo.","muller_lyer":"La línea con las aletas hacia fuera parece más larga que la de las aletas hacia dentro. Son iguales.","poggendorff":"La línea negra que entra por la izquierda en el bloque gris parece salir como línea azul. Sale como la negra de arriba: active la ayuda para verlo."},"aids":{"contrast":"Se quitan los cuatro fondos.","bezold":"Se quitan las franjas.","constancy":"Se quita todo menos las dos baldosas comparadas.","lilac":"La animación se detiene.","checker":"Una banda de un solo color une las casillas A y B.","white":"Se quitan las franjas.","mach":"Unos huecos separan las bandas, y cada una parece uniforme.","cornsweet":"Se tapa el borde entre las dos mitades.","ehrenstein":"Las líneas se completan, y los discos desaparecen.","irradiation":"Unas líneas guía comparan los lados de los cuadrados.","ebbinghaus":"Dos líneas paralelas tocan los dos círculos centrales.","muller_lyer":"Se quitan las puntas y se comparan las longitudes.","ponzo":"Se quita la vía del tren.","cafe":"Se trazan rectas sobre el mortero.","fraser":"Se dibujan círculos perfectos sobre la figura.","hering":"Se quitan las líneas del fondo.","wundt":"Se quitan las líneas del fondo.","orbison":"Se quitan los anillos del fondo.","zollner":"Se quitan los trazos cortos.","poggendorff":"Se muestra la parte oculta de la línea.","tilt":"Se quitan las rejillas de alrededor."}},"title":"Ilusiones de Color","subtitle":"Lo que ve el ojo no es lo que hay en la página","headings":["Lo que se ve","Por qué ocurre","Pruebe"],"categories":{"colour":"Color","brightness":"Luminosidad y contraste","size":"Tamaño y longitud","lines":"Líneas curvadas e inclinadas","motion":"Movimiento en imágenes fijas","form":"Figura, fondo y objetos imposibles"},"texts":{"contrast":["Contraste simultáneo","Los cuatro cuadrados pequeños son del mismo gris. Sobre el fondo oscuro parece más claro que sobre el claro; sobre azul tira a amarillo y sobre amarillo tira a azul.","El color se juzga por diferencia. El fondo aleja de sí la zona que rodea, en luminosidad y en tono.","Haga dos agujeros en un papel para ver solo dos de los cuadrados pequeños: la diferencia desaparece."],"bezold":["Efecto Bezold","El rojo entre rayas negras parece más profundo y oscuro que el rojo entre rayas blancas, que parece más pálido y rosado. Es un único rojo.","Cuando se alternan pequeñas áreas de color, el ojo las mezcla en parte (asimilación): el rojo toma algo de su vecino. Wilhelm von Bezold lo observó al rediseñar alfombras cambiando un solo color.","Aléjese de la página: cuanto más lejos, más fuerte la mezcla."],"constancy":["Constancia del color","Dos copias de un mosaico están iluminadas por una luz cálida y otra fría (los discos de arriba). La segunda pieza de la segunda fila parece azulada a la izquierda y amarillenta a la derecha, pero es el mismo gris neutro.","Para reconocer los objetos, el cerebro estima el color de la luz y lo descuenta. Un gris en una escena toda anaranjada se lee como una superficie azulada.","Tape todo menos las dos piezas grises."],"afterimage":["Imagen remanente negativa","Tras fijar la vista en el punto de los anillos de colores, el punto solo de la derecha parece rodeado de anillos de otros colores: rojo, verde y amarillo.","Las células que responden a un color se cansan (se adaptan). Sobre blanco, las demás responden con más fuerza y se ve el color complementario.","Mire el punto izquierdo 30 segundos sin mover los ojos, luego mire el punto derecho y parpadee."],"lilac":["Perseguidor lila","Con la vista en la cruz, un hueco recorre el anillo de discos lilas; después el hueco se convierte en un disco verde y, al cabo de un rato, los discos lilas pueden desaparecer.","El hueco que avanza es movimiento aparente (fenómeno phi). Donde desaparece un disco surge una imagen remanente del color opuesto, verde. Los discos borrosos y quietos en la periferia se desvanecen (efecto Troxler).","Fije la cruz al menos 30 segundos. Jeremy Hinton creó esta animación antes de 2005."],"mccollough":["Efecto McCollough","Tras mirar por turnos rayas horizontales rojas y verticales verdes, las manchas en blanco y negro de abajo parecen teñidas: verdosas donde las rayas son horizontales y rosadas donde son verticales.","El sistema visual se adapta a un color ligado a una orientación. Celeste McCollough lo describió en 1965; puede durar horas e incluso meses.","Alterne entre las dos rejillas de color, unos segundos en cada una, durante varios minutos, y mire después las manchas pequeñas. Atención: el efecto puede persistir mucho."],"chromostereopsis":["Cromoestereopsis","El rojo y el azul sobre negro no parecen estar en el mismo plano: para la mayoría el rojo flota delante del azul; para algunas personas queda detrás.","El cristalino desvía de forma distinta las longitudes de onda cortas y largas (aberración cromática), los dos colores caen en sitios algo distintos en cada ojo y el cerebro lee el desfase como profundidad.","Mírelo en una sala con poca luz, con ambos ojos; pruebe con gafas y sin ellas."],"checker":["Ilusión de la sombra en el tablero","El cuadrado A parece mucho más oscuro que el B. Son exactamente del mismo gris, como muestra la barra de la segunda figura.","El cerebro ve un suelo a cuadros con una sombra y la corrige: B tiene que ser un cuadrado claro, así que se ve claro. Edward Adelson publicó la ilusión en 1995.","Tape el resto del tablero con dos papeles, dejando solo A y B."],"white":["Ilusión de White y de Munker","Las barras grises metidas en las rayas negras parecen más claras que las metidas en las rayas blancas. En la versión en color (Munker), el mismo rojo parece anaranjado a un lado y violáceo al otro.","Sorprendentemente, el resultado contradice lo que predeciría el contraste simple: el ojo parece agrupar cada barra con la raya a la que pertenece.","Compare los dos grupos a través de un agujero pequeño en un papel."],"mach":["Bandas de Mach","Cada franja gris lisa parece más oscura junto a su vecina clara y más clara junto a la oscura, como si las franjas fueran acanaladas.","Las células vecinas de la retina se inhiben entre sí (inhibición lateral), lo que exagera los bordes. Ernst Mach describió el efecto en 1865.","Tape todas las franjas menos una: es perfectamente uniforme."],"cornsweet":["Ilusión de Cornsweet","La mitad izquierda parece más clara que la derecha. Lejos del centro, son del mismo gris.","Solo el borde difiere, subiendo a un lado y bajando al otro. El sistema visual toma el escalón del borde como la diferencia entre las áreas enteras.","Ponga un lápiz sobre la línea central y verá igualarse las dos mitades."],"grid":["Ilusiones de rejilla: Hermann y centelleante","En la rejilla blanca aparecen manchas grises en los cruces, salvo donde se mira. Con discos sobre una rejilla gris, puntos negros parecen encenderse y apagarse.","La rejilla de Hermann (1870) se explicó mucho tiempo solo por inhibición lateral; experimentos posteriores (curvar las líneas la elimina) muestran que depende también de cómo trata la corteza las líneas rectas. La versión centelleante se describió en los 90.","Pasee la mirada por la rejilla y después fije un solo cruce."],"ehrenstein":["Ilusión de Ehrenstein","Donde las líneas se detienen antes de cruzarse parecen surgir discos luminosos, más blancos que el papel.","Los extremos de las líneas sugieren una forma encima que tapa los cruces. El cerebro dibuja su contorno (contorno ilusorio) y lo llena de brillo.","Cierre los huecos con la imaginación, o con un lápiz: los discos desaparecen."],"irradiation":["Ilusión de irradiación","El cuadrado blanco sobre negro parece mayor que el negro sobre blanco, pero miden lo mismo.","La luz se dispersa dentro del ojo y una zona clara se ensancha en la retina. Galileo la menciona en 1632; Helmholtz le dio nombre.","Mida los dos cuadrados."],"ebbinghaus":["Ilusión de Ebbinghaus (círculos de Titchener)","El círculo naranja rodeado de círculos grandes parece menor que el rodeado de círculos pequeños.","El tamaño se juzga según el contexto; la distancia y la separación de los círculos de alrededor también influyen.","Tape los círculos azules con los dedos."],"muller_lyer":["Ilusión de Müller-Lyer","La línea con las aletas hacia fuera parece más larga que la de las aletas hacia dentro. Son iguales, como la línea roja de abajo.","Las aletas desplazan el lugar donde parecen estar los extremos; una explicación las relaciona con las esquinas de salas y edificios vistos en profundidad. Franz Müller-Lyer la describió en 1889.","Compare los dos segmentos con las guías discontinuas."],"ponzo":["Ilusión de Ponzo","La barra amarilla de arriba parece más larga que la de abajo.","Las líneas convergentes sugieren distancia, como unas vías: una barra del mismo tamaño en la página, pero más lejana, tendría que ser mayor.","Mida las dos barras o ponga la página del revés."],"cafe":["Ilusión de la pared del café","Las líneas grises de mortero parecen inclinarse alternadamente, pero son paralelas y horizontales.","Las baldosas blancas y negras desplazadas, con un mortero de gris intermedio, crean pequeños elementos inclinados a lo largo de cada línea. Richard Gregory le dio nombre en 1973 por la pared de un café de Bristol.","Mire a lo largo de una línea de mortero con la página casi de canto."],"fraser":["Espiral de Fraser","Parece haber una espiral que se enrolla hacia el centro. No la hay: los cordones blancos y negros forman círculos concéntricos.","Cada tramo corto está inclinado y el fondo retorcido refuerza la inclinación, así que el ojo los une en una espiral. James Fraser la describió en 1908.","Ponga un dedo en un cordón y sígalo: volverá al punto de partida."],"hering":["Ilusión de Hering","Las dos líneas rojas parecen curvarse hacia fuera en el centro. Son rectas y paralelas.","Los ángulos con las líneas radiales se sobrestiman y el patrón sugiere además un movimiento en profundidad. Ewald Hering la descubrió en 1861.","Apoye una regla en una línea roja."],"wundt":["Ilusión de Wundt","Las dos líneas rojas parecen curvarse hacia dentro, una hacia la otra, en el centro. Son rectas y paralelas.","Es el reverso de la figura de Hering: las líneas radiales parten ahora de puntos a un lado y a otro, y los ángulos sesgan las líneas rojas en sentido contrario. Wilhelm Wundt la describió en 1898.","Compárela con la ilusión de Hering."],"orbison":["Ilusión de Orbison","El cuadrado rojo parece deformado, con los lados vencidos y las esquinas estiradas.","Como en la figura de Hering, los cruces con los anillos del fondo sesgan la dirección percibida de cada lado. William Orbison la describió en 1939.","Compruebe los lados con una regla."],"zollner":["Ilusión de Zöllner","Las líneas diagonales largas parecen converger y divergir. Son paralelas.","Los trazos cortos las cruzan en ángulo y el sistema visual exagera los ángulos agudos, girando un poco cada línea. Johann Zöllner la comunicó en 1860.","Mire a lo largo de las líneas largas desde una esquina de la página."],"poggendorff":["Ilusión de Poggendorff","La línea negra que entra por la izquierda en el bloque gris parece salir como línea azul. Sale como la negra de arriba, como muestra la segunda figura.","Los ángulos agudos entre la línea y el bloque parecen más abiertos de lo que son y desplazan el trayecto aparente. Se advirtió en los propios dibujos de Zöllner.","Prolongue la línea izquierda con una regla."],"tilt":["Ilusión y efecto posterior de inclinación","Las rayas de los dos discos interiores son verticales, pero parecen inclinarse en sentido contrario a las de alrededor.","Las células sintonizadas a orientaciones próximas se inhiben y alejan el ángulo percibido. Mirar mucho rato rayas inclinadas tiene un efecto parecido sobre lo que se ve después.","Tape los anillos exteriores y compare los discos interiores."],"motion":["Movimiento ilusorio","Las ruedas parecen girar despacio, sobre todo las que no se miran directamente.","Los bloques de distinto contraste se procesan con retrasos algo distintos y cada pequeño movimiento de los ojos reinicia la secuencia; los detectores de movimiento la leen como desplazamiento.","Salte la mirada de una rueda a otra, o parpadee."],"drift":["Deriva periférica","Los anillos de rampas grises parecen girar cuando se ven con el rabillo del ojo.","Una rampa repetida de oscuro a claro (diente de sierra) estimula los detectores de movimiento de la periferia; el movimiento se ve de lo oscuro a lo claro.","Mire al lado de la figura y parpadee deprisa."],"rubin":["Copa de Rubin","Una copa clara, o dos caras oscuras frente a frente: lo uno o lo otro, difícilmente a la vez.","El contorno común solo puede pertenecer a un lado cada vez: lo que se toma como figura recibe la forma y el resto pasa a ser fondo. Edgar Rubin la estudió hacia 1915.","Intente alternar a voluntad y cuente cuántas veces cambia sola."],"penrose":["Triángulo de Penrose","Un triángulo macizo de tres vigas cuadradas, cada una unida a la siguiente en ángulo recto.","Cada esquina es coherente por sí sola, pero las tres no pueden ser ciertas a la vez: el objeto no existe. Oscar Reutersvärd lo dibujó en 1934; Lionel y Roger Penrose lo popularizaron, e inspiró la Cascada de M. C. Escher.","Tape una esquina cada vez: lo demás se vuelve posible."]},"links":{"contrast":["https://es.wikipedia.org/wiki/Efecto_contraste",true],"bezold":["https://es.wikipedia.org/wiki/Efecto_Bezold",true],"constancy":["https://en.wikipedia.org/wiki/Color_constancy",false],"afterimage":["https://es.wikipedia.org/wiki/Imagen_remanente",true],"lilac":["https://es.wikipedia.org/wiki/Perseguidor_del_lila",true],"mccollough":["https://es.wikipedia.org/wiki/Efecto_McCollough",true],"chromostereopsis":["https://en.wikipedia.org/wiki/Chromostereopsis",false],"checker":["https://es.wikipedia.org/wiki/Tablero_de_ajedrez_de_Adelson",true],"white":["https://en.wikipedia.org/wiki/White%27s_illusion",false],"mach":["https://es.wikipedia.org/wiki/Bandas_de_Mach",true],"cornsweet":["https://es.wikipedia.org/wiki/Ilusi%C3%B3n_de_Cornsweet",true],"grid":["https://en.wikipedia.org/wiki/Grid_illusion",false],"ehrenstein":["https://es.wikipedia.org/wiki/Ilusi%C3%B3n_de_Ehrenstein",true],"irradiation":["https://es.wikipedia.org/wiki/Irradiaci%C3%B3n_%28%C3%B3ptica%29",true],"ebbinghaus":["https://es.wikipedia.org/wiki/Ilusi%C3%B3n_de_Ebbinghaus",true],"muller_lyer":["https://es.wikipedia.org/wiki/Ilusi%C3%B3n_de_M%C3%BCller-Lyer",true],"ponzo":["https://es.wikipedia.org/wiki/Ilusi%C3%B3n_de_Ponzo",true],"cafe":["https://es.wikipedia.org/wiki/Ilusi%C3%B3n_de_la_pared_de_la_cafeter%C3%ADa",true],"fraser":["https://es.wikipedia.org/wiki/Ilusi%C3%B3n_de_la_espiral_de_Fraser",true],"hering":["https://es.wikipedia.org/wiki/Ilusi%C3%B3n_de_Hering",true],"wundt":["https://es.wikipedia.org/wiki/Ilusi%C3%B3n_de_Wundt",true],"orbison":["https://es.wikipedia.org/wiki/Ilusi%C3%B3n_de_Orbison",true],"zollner":["https://es.wikipedia.org/wiki/Ilusi%C3%B3n_de_Z%C3%B6llner",true],"poggendorff":["https://es.wikipedia.org/wiki/Ilusi%C3%B3n_de_Poggendorff",true],"tilt":["https://en.wikipedia.org/wiki/Visual_tilt_effects",false],"motion":["https://en.wikipedia.org/wiki/Illusory_motion",false],"drift":["https://en.wikipedia.org/wiki/Peripheral_drift_illusion",false],"rubin":["https://es.wikipedia.org/wiki/Copa_de_Rubin",true],"penrose":["https://es.wikipedia.org/wiki/Tri%C3%A1ngulo_de_Penrose",true]},"wiki":"Artículo en Wikipedia","inEnglish":"en inglés"}}}</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const $ = id => document.getElementById(id);
const state = { lang: "en", index: 0, variant: 0, palette: "original", dark: "#000000", light: "#ffffff",
                accent: "#d02028", own: {}, hue: 0, aided: false };

// ---------------------------------------------------------------- colours
const rgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const hex = c => "#" + c.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join("");
const isGrey = h => { const [r, g, b] = rgb(h); return r === g && g === b; };

function rotate(colour, degrees) {
  if (!degrees) return colour;
  const [r, g, b] = rgb(colour).map(v => v / 255);
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min, l = (max + min) / 2;
  if (!d) return colour;
  const s = d / (1 - Math.abs(2 * l - 1));
  let h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
  h = (h * 60 + degrees + 360) % 360;
  const f = n => {
    const k = (n + h / 30) % 12;
    return 255 * (l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1)));
  };
  return hex([f(0), f(8), f(4)]);
}

const current = () => DATA.illusions[state.index];
const fixedColours = () => DATA.fixed.includes(current().key);
const followsAccent = el => el.matches(".t-aid, .t-guide") || DATA.lineAccent.includes(current().key);

// Colour of one element: greys are mixed from the pair, so equal greys stay equal.
function mapped(original, el) {
  const pair = !fixedColours();
  let colour = original;
  if (isGrey(original)) {
    if (pair) {
      const t = rgb(original)[0] / 255, a = rgb(state.dark), b = rgb(state.light);
      colour = hex(a.map((v, i) => v + (b[i] - v) * t));
    }
  } else if (state.own[original]) {
    colour = state.own[original];
  } else if (pair && state.palette !== "original" && followsAccent(el)) {
    colour = state.accent;
  }
  return rotate(colour, state.hue);
}

function paint() {
  for (const el of $("stage").querySelectorAll("[data-fill], [data-stroke]")) {
    for (const what of ["fill", "stroke"]) {
      if (el.dataset[what]) el.setAttribute(what, mapped(el.dataset[what], el));
    }
  }
}

// Colour pickers for the chromatic colours of the figure, when there are only a few.
function pickers() {
  const found = new Map();
  for (const el of $("stage").querySelectorAll("[data-fill], [data-stroke]")) {
    if (el.matches(".t-aid, .t-guide")) continue;
    for (const c of [el.dataset.fill, el.dataset.stroke]) {
      if (c && !isGrey(c) && !found.has(c)) found.set(c, el);
    }
  }
  const box = $("pickers");
  box.replaceChildren();
  if (found.size > 4) return;
  const ui = DATA.languages[state.lang].ui;
  let n = 0;
  for (const [original, el] of found) {
    const label = document.createElement("label"), input = document.createElement("input");
    label.textContent = ui.colour + " " + (++n);
    input.type = "color";
    const hue = state.hue;
    state.hue = 0;
    input.value = mapped(original, el);
    state.hue = hue;
    input.addEventListener("input", () => { state.own[original] = input.value; paint(); });
    label.append(input);
    box.append(label);
  }
}

// ---------------------------------------------------------------- page
function option(value, text) {
  const o = document.createElement("option");
  o.value = value;
  o.textContent = text;
  return o;
}

function figure() {
  const stage = $("stage");
  stage.innerHTML = current().variants[state.variant][1];
  const svg = stage.querySelector("svg");
  svg.removeAttribute("width");
  svg.removeAttribute("height");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", DATA.languages[state.lang].texts[current().key][0]);
  for (const el of svg.querySelectorAll("path, circle, text")) {
    for (const what of ["fill", "stroke"]) {
      const c = el.getAttribute(what);
      if (c && c !== "none") el.dataset[what] = c;
    }
  }
  paint();
  pickers();
  help();
}

function help() {
  const key = current().key, ui = DATA.languages[state.lang].ui, text = ui.aids[key];
  if (!text) state.aided = false;
  $("help").hidden = $("help-text").hidden = !text;
  $("help").textContent = state.aided ? ui.unhelp : ui.help;
  $("help").setAttribute("aria-pressed", state.aided);
  $("help-text").textContent = text || "";
  $("stage").classList.toggle("aided", state.aided);
  const svg = $("stage").querySelector("svg");
  if (key === DATA.animated) state.aided ? svg.pauseAnimations() : svg.unpauseAnimations();
}

function controls() {
  const fixed = fixedColours(), ui = DATA.languages[state.lang].ui;
  $("palette").value = state.palette;
  $("palette").disabled = $("dark").disabled = $("light").disabled = fixed;
  $("dark").value = state.dark;
  $("light").value = state.light;
  $("hue").value = state.hue;
  $("note").textContent = fixed ? ui.fixed : state.palette === "original" ? "" : ui.note;
}

function show() {
  const L = DATA.languages[state.lang], ui = L.ui, item = current(), texts = L.texts[item.key];
  document.documentElement.lang = state.lang;
  document.title = L.title + " – " + texts[0];
  $("title").textContent = L.title;
  $("subtitle").textContent = L.subtitle;
  for (const el of document.querySelectorAll("[data-ui]")) el.textContent = ui[el.dataset.ui];
  $("previous").title = ui.previous;
  $("next").title = ui.next;
  $("previous").setAttribute("aria-label", ui.previous);
  $("next").setAttribute("aria-label", ui.next);

  $("illusion").replaceChildren(...DATA.categories.map(category => {
    const group = document.createElement("optgroup");
    group.label = L.categories[category];
    DATA.illusions.forEach((it, i) => {
      if (it.category === category) group.append(option(i, L.texts[it.key][0]));
    });
    return group;
  }));
  $("illusion").value = state.index;

  $("variant-box").hidden = item.variants.length < 2;
  $("variant").replaceChildren(...item.variants.map((v, i) => option(i, v[0] || ui.scintillating)));
  $("variant").value = state.variant;

  $("palette").replaceChildren(...DATA.palettes.map(p => option(p[0], ui[p[0]])), option("custom", ui.custom));

  $("name").textContent = texts[0];
  const blocks = [];
  L.headings.forEach((heading, i) => {
    const h = document.createElement("h3"), p = document.createElement("p");
    h.textContent = heading;
    p.textContent = (i === 0 && ui.see[item.key]) || texts[i + 1];
    blocks.push(h, p);
  });
  const [url, own] = L.links[item.key], more = document.createElement("p"), a = document.createElement("a");
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener";
  a.textContent = L.wiki + (own ? "" : " (" + L.inEnglish + ")");
  more.append(a);
  more.style.marginTop = "12px";
  blocks.push(more);
  $("texts").replaceChildren(...blocks);

  controls();
  figure();
}

function go(index) {
  const n = DATA.illusions.length;
  Object.assign(state, { index: (index + n) % n, variant: 0, own: {}, hue: 0, aided: false });
  history.replaceState(null, "", "#" + current().key);
  show();
}

function choosePalette(id) {
  const p = DATA.palettes.find(q => q[0] === id);
  state.palette = id;
  if (p) [, state.dark, state.light, state.accent] = p;
  state.own = {};
  controls();
  paint();
  pickers();
}

$("lang").addEventListener("change", e => { state.lang = e.target.value; show(); });
$("illusion").addEventListener("change", e => go(Number(e.target.value)));
$("previous").addEventListener("click", () => go(state.index - 1));
$("next").addEventListener("click", () => go(state.index + 1));
$("variant").addEventListener("change", e => {
  state.variant = Number(e.target.value);
  state.own = {};
  figure();
});
$("palette").addEventListener("change", e => choosePalette(e.target.value));
for (const id of ["dark", "light"]) {
  $(id).addEventListener("input", e => {
    state[id] = e.target.value;
    state.palette = "custom";
    controls();
    paint();
  });
}
$("hue").addEventListener("input", e => { state.hue = Number(e.target.value); paint(); });
$("reset").addEventListener("click", () => { state.hue = 0; choosePalette("original"); });
$("help").addEventListener("click", () => { state.aided = !state.aided; help(); });

const NAMES = { en: "English", pt: "Português", es: "Español" };
$("lang").append(...Object.keys(DATA.languages).map(code => option(code, NAMES[code] || code)));
const preferred = (navigator.language || "en").slice(0, 2);
state.lang = DATA.languages[preferred] ? preferred : "en";
$("lang").value = state.lang;
const wanted = DATA.illusions.findIndex(it => "#" + it.key === location.hash);
state.index = Math.max(0, wanted);
show();
</script>
</body>
</html>
