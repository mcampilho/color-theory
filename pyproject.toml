[project]
name = "color-theory"
version = "1.0.0"
description = "Colour theory poster, build-your-own colour wheels, tilings, patterns, wallpapers and illusions"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "reportlab>=4.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
# colortheory.wallpapers
wallpapers = ["numpy>=1.24", "scipy>=1.10"]
# Arabic (right to left): joins the letters and orders each line
rtl = ["arabic-reshaper>=3.0", "python-bidi>=0.6"]
# colortheory.wheel --webview
app = ["pywebview"]
dev = ["pytest>=8", "ruff>=0.6"]
all = ["color-theory[wallpapers,rtl,app]"]

[project.scripts]
colortheory-poster = "colortheory.poster:main"
colortheory-document = "colortheory.document:main"
colortheory-wheel = "colortheory.wheel:main"
colortheory-tilings = "colortheory.tilings:main"
colortheory-patterns = "colortheory.patterns:main"
colortheory-illusions = "colortheory.illusions:main"
colortheory-illusion-page = "colortheory.illusion_page:main"
colortheory-wallpapers = "colortheory.wallpapers:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "fonts: needs the Windows/CJK/Arabic fonts of i18n.py (skipped where they are missing)",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src"]
extend-exclude = [".venv", "web"]

[tool.ruff.lint]
# no "I" (isort): some imports come after code on purpose (sys.path, merged translation tables)
select = ["E", "F", "B", "UP", "SIM"]
ignore = [
    "UP031",   # '%' formatting is deliberate: the translations hold %d / %s placeholders
    "B905",    # zip() without strict=
    "E501",    # the code is long-lined by design (see line-length); the formatter is not enforced
    "E741",    # ambiguous names (l, O, I) are used in colour and geometry maths
    "E731",    # short lambdas assigned to names
    "SIM108",  # ternaries that would hurt readability
    "SIM102",
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
"src/colortheory/locales/*.py" = ["E501"]
"tests/*.py" = ["E402"]
